[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-tech-upgrade"
version = "0.1.0"
description = "A source-grounded, personalized daily technical reading brief"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "trafilatura>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.0,<2",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
daily-tech = "daily_tech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_tech = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
